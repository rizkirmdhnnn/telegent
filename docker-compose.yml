services:
  telegent:
    build: .
    image: telegent:latest
    # `.env` opsional: container tetap boot tanpa file ini (kredensial diisi dari
    # panel). Migrasi dari deployment CLI: letakkan TELEGRAM_API_ID/HASH &
    # GEMINI_API_KEY di .env, nilainya diimpor sekali ke database saat boot.
    env_file:
      - path: .env
        required: false
    environment:
      # Satu sumber kebenaran direktori data: DB, *.session, dan .secret_key.
      TELEGENT_DATA_DIR: /data
      # Di dalam container panel harus bind 0.0.0.0 (port di host tetap loopback).
      TELEGENT_HOST: 0.0.0.0
      TELEGENT_PORT: "8080"
      TELEGENT_AUTOSTART_BOT: "true"
      # CATATAN: `TELEGENT_FAKE` sengaja TIDAK ada di sini.
      # Mode tiruan hanya lewat env proses eksplisit, misalnya:
      #   docker compose run -e TELEGENT_FAKE=1 telegent
      # Kalau variabel ini diekspos lewat compose (atau `env_file`), maka
      # `TELEGENT_FAKE=1` yang tertinggal di `.env` akan diam-diam menyalakan bot
      # tiruan di produksi — persis yang dijanjikan tidak mungkin terjadi.
    ports:
      # Hanya host lokal yang bisa mengakses (Q16). Akses dari jaringan lain
      # lewat VPN/tunnel — lihat docs/web-panel/deployment.md.
      - "127.0.0.1:8080:8080"
    volumes:
      # DB + *.session + .secret_key. JANGAN dihapus tanpa backup: kehilangan
      # .secret_key membuat secret tersimpan tidak dapat dibaca lagi.
      - ./data:/data
    restart: unless-stopped
    # Beri waktu runtime menutup panggilan & database dengan rapi.
    stop_grace_period: 30s
    # Panggilan P2P Telegram butuh UDP keluar. Mode bridge umumnya cukup
    # (relay/reflector Telegram). Bila media tidak tersambung, aktifkan host:
    # network_mode: host