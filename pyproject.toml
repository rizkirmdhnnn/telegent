[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegent"
version = "0.2.0"
description = "Telegent - AI voice agent untuk panggilan Telegram (Gemini Live API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyrogram==2.0.106",
    "tgcrypto==1.2.5",
    "ntgcalls>=3.0.0,<=3.0.2",
    "google-genai>=2.29.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4",
    # --- Web panel (Fase 0) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
# Alat bantu PoC lokal (Fase 1: mikrofon/speaker). Tidak dibutuhkan di server/Docker.
poc = ["sounddevice>=0.5.0"]

[project.scripts]
telegent = "telegent.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyright>=1.1", "httpx>=0.27.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Peredam noise: pyrogram memanggil asyncio.get_event_loop() saat import.
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning",
]
