[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegent"
version = "0.2.0"
description = "Telegent - AI voice agent untuk panggilan Telegram (Gemini Live API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyrogram==2.0.106",
    "tgcrypto==1.2.5",
    "ntgcalls>=3.0.0,<=3.0.2",
    "google-genai>=2.29.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Alat bantu PoC lokal (Fase 1: mikrofon/speaker). Tidak dibutuhkan di server/Docker.
poc = ["sounddevice>=0.5.0"]

[project.scripts]
telegent = "telegent.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyright>=1.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
